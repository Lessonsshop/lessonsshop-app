<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lessons Shop - Coach Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; }
    .muted { color: #6b7280; }
    .kpi-value { font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
    .up { color: #16a34a; font-weight: 600; }
    .down { color: #dc2626; font-weight: 600; }
    .flat { color: #6b7280; font-weight: 600; }
    .pill {
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .logo-wrap img {
      height: 42px;
      width: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="min-h-screen">
    <!-- Top Nav -->
    <header class="bg-white border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-chalkboard-user text-blue-600 text-xl"></i>
          <h1 class="text-xl font-bold">Coach Portal</h1>
        </div>

        <!-- Upper-right logo -->
        <div class="flex items-center gap-4">
          <div class="logo-wrap">
            <img src="Lessonsshop%20updated%20logo.jpg" alt="Lessons Shop Logo" />
          </div>
          <span class="pill">Coach</span>
          <a href="index.html" class="text-sm text-blue-600 hover:text-blue-700 font-semibold">
            <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <!-- New left dropdown under header -->
      <section class="mb-4">
        <div class="w-full sm:w-72">
          <label for="quickMenu" class="block text-sm font-medium text-gray-700 mb-1">Quick Menu</label>
          <select id="quickMenu"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Select an option</option>
            <option value="calendar">Calendar</option>
            <option value="notes">Notes</option>
            <option value="students">Students</option>
          </select>
        </div>
      </section>

      <!-- Dashboard Header + Filter -->
      <section class="mb-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-2xl font-bold">Dashboard</h2>
            <p class="muted">Overview metrics with period comparisons.</p>
          </div>
          <div class="flex items-center gap-2">
            <label for="dateRange" class="text-sm font-medium text-gray-700">Date Range:</label>
            <select id="dateRange"
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="this_month">This month</option>
              <option value="last_month">Last month</option>
              <option value="this_quarter">This quarter</option>
              <option value="this_year">This year</option>
            </select>
          </div>
        </div>
      </section>

      <!-- KPI Grid -->
      <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 mb-8" id="kpiGrid">
        <article class="card p-5">
          <p class="text-sm muted mb-2">Total Students This Year</p>
          <p class="kpi-value" id="kpi_students_year">0</p>
          <p class="text-sm mt-2" id="cmp_students_year">-</p>
        </article>

        <article class="card p-5">
          <p class="text-sm muted mb-2">Lessons This Month</p>
          <p class="kpi-value" id="kpi_lessons_month">0</p>
          <p class="text-sm mt-2" id="cmp_lessons_month">-</p>
        </article>

        <article class="card p-5">
          <p class="text-sm muted mb-2">Lessons This Week</p>
          <p class="kpi-value" id="kpi_lessons_week">0</p>
          <p class="text-sm mt-2" id="cmp_lessons_week">-</p>
        </article>

        <article class="card p-5">
          <p class="text-sm muted mb-2">Average Daily Lessons</p>
          <p class="kpi-value" id="kpi_avg_daily">0</p>
          <p class="text-sm mt-2" id="cmp_avg_daily">-</p>
        </article>

        <article class="card p-5">
          <p class="text-sm muted mb-2">Avg Available Lesson Times / Week</p>
          <p class="kpi-value" id="kpi_avg_slots_week">0</p>
          <p class="text-sm mt-2" id="cmp_avg_slots_week">-</p>
        </article>

        <article class="card p-5">
          <p class="text-sm muted mb-2">New Lessons This Month</p>
          <p class="kpi-value" id="kpi_new_lessons_month">0</p>
          <p class="text-sm mt-2" id="cmp_new_lessons_month">-</p>
        </article>
      </section>
    </main>
  </div>

  <script>
    const dashboardData = {
      this_month: {
        label: "previous month",
        current: { studentsYear: 124, lessonsMonth: 38, lessonsWeek: 11, avgDaily: 1.27, avgSlotsWeek: 22.5, newLessonsMonth: 5 },
        previous:{ studentsYear: 116, lessonsMonth: 31, lessonsWeek: 9,  avgDaily: 1.03, avgSlotsWeek: 24.0, newLessonsMonth: 3 }
      },
      last_month: {
        label: "month before last",
        current: { studentsYear: 116, lessonsMonth: 31, lessonsWeek: 9,  avgDaily: 1.03, avgSlotsWeek: 24.0, newLessonsMonth: 3 },
        previous:{ studentsYear: 109, lessonsMonth: 27, lessonsWeek: 8,  avgDaily: 0.90, avgSlotsWeek: 21.8, newLessonsMonth: 2 }
      },
      this_quarter: {
        label: "previous quarter",
        current: { studentsYear: 124, lessonsMonth: 102, lessonsWeek: 10, avgDaily: 1.13, avgSlotsWeek: 23.2, newLessonsMonth: 12 },
        previous:{ studentsYear: 98,  lessonsMonth: 88,  lessonsWeek: 8,  avgDaily: 0.98, avgSlotsWeek: 21.4, newLessonsMonth: 9 }
      },
      this_year: {
        label: "previous year",
        current: { studentsYear: 124, lessonsMonth: 426, lessonsWeek: 10, avgDaily: 1.17, avgSlotsWeek: 22.9, newLessonsMonth: 46 },
        previous:{ studentsYear: 97,  lessonsMonth: 371, lessonsWeek: 8,  avgDaily: 1.02, avgSlotsWeek: 20.8, newLessonsMonth: 39 }
      }
    };

    function formatNumber(v){ return Number.isInteger(v) ? `${v}` : v.toFixed(2).replace(/\.00$/, ""); }
    function pctChange(c,p){ if(p===0) return c===0 ? 0 : 100; return ((c-p)/Math.abs(p))*100; }

    function comparisonText(current, previous, label, isInteger=true){
      const delta = current - previous;
      const pct = pctChange(current, previous);
      const sign = delta > 0 ? "+" : "";
      const cls = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
      const deltaText = isInteger ? `${sign}${Math.round(delta)}` : `${sign}${delta.toFixed(2).replace(/\.00$/, "")}`;
      const pctText = `${pct > 0 ? "+" : ""}${pct.toFixed(1)}%`;
      return `<span class="${cls}">${deltaText} (${pctText})</span> <span class="muted">vs ${label}</span>`;
    }

    function setText(id, val){ const el=document.getElementById(id); if(el) el.textContent = val; }
    function setHTML(id, val){ const el=document.getElementById(id); if(el) el.innerHTML = val; }

    function renderDashboard(rangeKey){
      const d = dashboardData[rangeKey] || dashboardData.this_month;
      const c = d.current, p = d.previous, label = d.label;

      setText("kpi_students_year", formatNumber(c.studentsYear));
      setText("kpi_lessons_month", formatNumber(c.lessonsMonth));
      setText("kpi_lessons_week", formatNumber(c.lessonsWeek));
      setText("kpi_avg_daily", formatNumber(c.avgDaily));
      setText("kpi_avg_slots_week", formatNumber(c.avgSlotsWeek));
      setText("kpi_new_lessons_month", formatNumber(c.newLessonsMonth));

      setHTML("cmp_students_year", comparisonText(c.studentsYear, p.studentsYear, label, true));
      setHTML("cmp_lessons_month", comparisonText(c.lessonsMonth, p.lessonsMonth, label, true));
      setHTML("cmp_lessons_week", comparisonText(c.lessonsWeek, p.lessonsWeek, label, true));
      setHTML("cmp_avg_daily", comparisonText(c.avgDaily, p.avgDaily, label, false));
      setHTML("cmp_avg_slots_week", comparisonText(c.avgSlotsWeek, p.avgSlotsWeek, label, false));
      setHTML("cmp_new_lessons_month", comparisonText(c.newLessonsMonth, p.newLessonsMonth, label, true));
    }

    document.getElementById("dateRange").addEventListener("change", e => renderDashboard(e.target.value));

    document.getElementById("quickMenu").addEventListener("change", (e) => {
      if (!e.target.value) return;
      alert(`Selected: ${e.target.options[e.target.selectedIndex].text}. (Routing can be added next.)`);
    });

    renderDashboard("this_month");
  </script>
</body>
</html>
