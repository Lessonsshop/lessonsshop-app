<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons Shop - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .login-container { min-height: 100vh; background: white; }
        .transition-smooth { transition: all 0.3s ease; }
        .form-input { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; font-size: 14px; }
        .form-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn-primary { background: #2563eb; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: white; color: #2563eb; padding: 12px 24px; border-radius: 8px; font-weight: 600; border: 2px solid #2563eb; transition: all 0.3s ease; }
        .btn-secondary:hover { background: #eff6ff; }
        .error-message { color: #dc2626; font-size: 14px; margin-top: 4px; }
        .success-message { color: #16a34a; font-size: 14px; margin-top: 4px; }
        .logo-img { width: 160px; height: 160px; object-fit: contain; }
    </style>
</head>
<body class="login-container">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-md">
            <!-- Logo/Brand -->
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <!-- Lessons Shop Golf Logo -->
                    <img src="Lessonsshop updated logo.jpg" alt="Lessons Shop Logo" class="logo-img">
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Lessons Shop</h1>
                <p class="text-gray-600">Golf Lesson Booking Platform</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8 mb-4">
                <!-- Tab Navigation -->
                <div class="flex gap-2 mb-8">
                    <button onclick="switchTab('student')" id="studentTab" 
                            class="flex-1 py-3 text-center font-semibold rounded-lg transition-smooth student-active" 
                            style="background: #2563eb; color: white;">
                        <i class="fas fa-user mr-2"></i>Student
                    </button>
                    <button onclick="switchTab('coach')" id="coachTab"
                            class="flex-1 py-3 text-center font-semibold rounded-lg transition-smooth" 
                            style="background: #e5e7eb; color: #6b7280;">
                        <i class="fas fa-chalkboard-user mr-2"></i>Coach
                    </button>
                </div>

                <!-- Student Login Form -->
                <form id="studentForm" onsubmit="handleStudentLogin(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-900 mb-2">Email Address</label>
                            <input type="email" id="studentEmail" placeholder="your@email.com" class="form-input w-full" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-900 mb-2">Password</label>
                            <div class="relative">
                                <input type="password" id="studentPassword" placeholder="••••••••" class="form-input w-full" required>
                                <button type="button" onclick="togglePassword('studentPassword')" class="absolute right-3 top-3 text-gray-500">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="flex items-center">
                                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
                                <span class="ml-2 text-sm text-gray-600">Remember me</span>
                            </label>
                            <a href="#" class="text-sm text-blue-600 hover:text-blue-700">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn-primary w-full">
                            Sign In as Student
                        </button>
                    </div>
                </form>

                <!-- Coach Login Form (Hidden by default) -->
                <form id="coachForm" onsubmit="handleCoachLogin(event)" style="display: none;">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-900 mb-2">Coach Email Address</label>
                            <input type="email" id="coachEmail" placeholder="coach@email.com" class="form-input w-full" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-900 mb-2">Password</label>
                            <div class="relative">
                                <input type="password" id="coachPassword" placeholder="••••••••" class="form-input w-full" required>
                                <button type="button" onclick="togglePassword('coachPassword')" class="absolute right-3 top-3 text-gray-500">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="flex items-center">
                                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
                                <span class="ml-2 text-sm text-gray-600">Remember me</span>
                            </label>
                            <a href="#" class="text-sm text-blue-600 hover:text-blue-700">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn-primary w-full">
                            Sign In as Coach
                        </button>
                    </div>
                </form>

                <!-- Sign Up Link -->
                <div class="text-center mt-6 pt-6 border-t">
                    <p class="text-gray-600">Don't have an account? <a href="#" class="text-blue-600 font-semibold hover:text-blue-700">Sign up here</a></p>
                </div>
            </div>

            <!-- Demo Credentials -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-gray-800 text-sm">
                <p class="font-semibold mb-2"><i class="fas fa-lightbulb mr-2 text-blue-600"></i>Demo Credentials:</p>
                <p><strong>Student:</strong> student@example.com / lessons123</p>
                <p><strong>Coach:</strong> coach@example.com / lessons123</p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const studentForm = document.getElementById('studentForm');
            const coachForm = document.getElementById('coachForm');
            const studentTab = document.getElementById('studentTab');
            const coachTab = document.getElementById('coachTab');

            if (tab === 'student') {
                studentForm.style.display = 'block';
                coachForm.style.display = 'none';
                studentTab.style.background = '#2563eb';
                studentTab.style.color = 'white';
                coachTab.style.background = '#e5e7eb';
                coachTab.style.color = '#6b7280';
            } else {
                studentForm.style.display = 'none';
                coachForm.style.display = 'block';
                studentTab.style.background = '#e5e7eb';
                studentTab.style.color = '#6b7280';
                coachTab.style.background = '#2563eb';
                coachTab.style.color = 'white';
            }
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        }

        function handleStudentLogin(event) {
            event.preventDefault();
            const email = document.getElementById('studentEmail').value;
            const password = document.getElementById('studentPassword').value;

            // Demo credentials
            if (email === 'student@example.com' && password === 'lessons123') {
                window.location.href = 'index.html';
            } else {
                alert('Invalid credentials. Use:\nEmail: student@example.com\nPassword: lessons123');
            }
        }

        function handleCoachLogin(event) {
            event.preventDefault();
            const email = document.getElementById('coachEmail').value;
            const password = document.getElementById('coachPassword').value;

            // Demo credentials
            if (email === 'coach@example.com' && password === 'lessons123') {
                window.location.href = 'coach-portal.html';
            } else {
                alert('Invalid credentials. Use:\nEmail: coach@example.com\nPassword: lessons123');
            }
        }
    </script>
</body>
</html>
